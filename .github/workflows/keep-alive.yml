name: Keep Render service awake

# DISABLED (no schedule trigger) - a 24/7 keep-alive ping burned through
# Render's free-tier monthly usage allowance in about 3 days and got the
# service suspended until the next billing period. Free tier fundamentally
# cannot run continuously without hitting that cap; re-enabling this on a
# schedule requires either upgrading to a paid Render instance, or a much
# narrower ping window than "every 10 minutes forever" - see the
# conversation with the user before turning this back on.
#
# workflow_dispatch is kept so it can still be run by hand if needed.

on:
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping healthz
        run: curl -sf https://popular-anime-bot.onrender.com/healthz
